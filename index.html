<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Awake alarm</title>
<meta name="description" content="Awake, the alarm you have to finish.">
<style>
  :root { --bg: #ffffff; --text: #16191a; --muted: #5b6366; --accent: #4d6b00; }
  @media (prefers-color-scheme: dark) { :root { --bg: #090c0d; --text: #f3f5f0; --muted: #9aa1a4; --accent: #c5f53c; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 40px; margin: 0; letter-spacing: -1px; color: var(--accent); }
  p { margin: 8px 0 0; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
<h1>Awake</h1>
<p>An alarm you have to finish. When it rings, a short wake task turns it off.</p>
<p class="muted" style="margin-top:24px"><a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
